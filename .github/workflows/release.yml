name: Release

# Tag a commit (`git tag v0.3.1 && git push origin v0.3.1`) and this builds the
# installers/packages, signs the Windows updater artifacts, and publishes the
# release together with `latest.json`, which is what installed copies poll.
#
# The release body comes from `docs/release-notes.md`, so rewrite that file before
# tagging. tauri-action uses the same string for the GitHub release and for the
# `notes` field of `latest.json`, which is what Kept's update window renders — a
# release published without notes leaves that window showing its built-in examples.
on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  release:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Cache Rust build
        uses: swatinem/rust-cache@v2
        with:
          workspaces: src-tauri

      - name: Install dependencies
        run: npm ci

      - name: Run backend tests
        working-directory: src-tauri
        run: cargo test

      # Read the notes once and hand them to the build step. An empty or missing
      # file publishes a release with no body, which is what happened before this
      # step existed, so a mistake here cannot break the build.
      - name: Read the release notes
        id: notes
        shell: bash
        run: |
          if [ -s docs/release-notes.md ]; then
            {
              echo 'body<<KEPT_RELEASE_NOTES_EOF'
              cat docs/release-notes.md
              echo 'KEPT_RELEASE_NOTES_EOF'
            } >> "$GITHUB_OUTPUT"
          fi

      - name: Build and publish
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        with:
          tagName: ${{ github.ref_name }}
          releaseName: Kept ${{ github.ref_name }}
          releaseBody: ${{ steps.notes.outputs.body }}
          releaseDraft: false
          prerelease: false
          args: --bundles nsis

      # The README links to a version-less asset name so the download link keeps
      # working across releases.
      - name: Attach the stable download alias
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          installer=$(ls src-tauri/target/release/bundle/nsis/*-setup.exe | head -n1)
          cp "$installer" src-tauri/target/release/bundle/nsis/Kept_x64-setup.exe
          gh release upload "${{ github.ref_name }}" \
            src-tauri/target/release/bundle/nsis/Kept_x64-setup.exe --clobber

  release-linux:
    needs: release
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            build-essential \
            curl \
            wget \
            file \
            libssl-dev \
            libayatana-appindicator3-dev \
            librsvg2-dev \
            libwebkit2gtk-4.1-dev \
            libgtk-3-dev \
            patchelf \
            xdg-utils

      - name: Install Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Cache Rust build
        uses: swatinem/rust-cache@v2
        with:
          workspaces: src-tauri

      - name: Install dependencies
        run: npm ci

      - name: Run backend tests
        working-directory: src-tauri
        run: cargo test

      # Build Linux bundles for end users (Beta). Artifacts are uploaded to the
      # release created by the Windows job above.
      - name: Build Linux packages
        run: npm run tauri build -- --bundles deb appimage rpm
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}

      - name: Upload Linux packages to release
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          shopt -s nullglob
          files=(
            src-tauri/target/release/bundle/deb/*.deb
            src-tauri/target/release/bundle/appimage/*.AppImage
            src-tauri/target/release/bundle/appimage/*.AppImage.tar.gz
            src-tauri/target/release/bundle/appimage/*.AppImage.tar.gz.sig
            src-tauri/target/release/bundle/rpm/*.rpm
          )
          if [ ${#files[@]} -eq 0 ]; then
            echo "No Linux bundle artifacts found to upload"
            exit 1
          fi
          gh release upload "${{ github.ref_name }}" "${files[@]}" --clobber
