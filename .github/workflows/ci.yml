name: CI

# The Mac build cannot be produced on the Windows dev machine, so every pull
# request builds and bundles it on a GitHub-hosted runner. This proves the code
# compiles, the tests pass and a launchable `.app` comes out of `tauri build`;
# clipboard capture, tray, hotkeys and TCC permissions still need a real Mac.
on:
  pull_request:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  macos:
    # `macos-latest` is an Apple Silicon runner. Intel Macs are built with
    # `--target x86_64-apple-darwin` once a universal bundle is wanted.
    runs-on: macos-latest
    # A cold release build takes ~20 minutes; anything far past that is stuck.
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v7

      - name: Install Node
        uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Cache Rust build
        uses: swatinem/rust-cache@v2
        with:
          workspaces: src-tauri

      - name: Install dependencies
        run: npm ci

      - name: Run backend tests
        working-directory: src-tauri
        run: cargo test

      # Updater artifacts are signed with a key only the release workflow holds,
      # so the pull request build turns them off rather than leaving the bundles
      # out. `beforeBuildCommand` still runs `tsc && vite build`.
      - name: Build the app bundle
        run: npm run tauri build -- --bundles app --config '{"bundle":{"createUpdaterArtifacts":false}}'

      - name: Check the bundle
        run: |
          app="src-tauri/target/release/bundle/macos/Kept.app"
          plist="$app/Contents/Info.plist"
          test -d "$app"
          plutil -lint "$plist"
          # The Mach-O is named by CFBundleExecutable, which is `kept` even
          # though the bundle is `Kept.app`. Per the macOS default volume,
          # asking for the wrong case would still match, so read the name.
          exe=$(/usr/libexec/PlistBuddy -c 'Print :CFBundleExecutable' "$plist")
          test -x "$app/Contents/MacOS/$exe"
          lipo -archs "$app/Contents/MacOS/$exe"
          # Ad-hoc signing has to be enough until a Developer ID exists; print
          # what the bundle got instead of failing when it is unsigned.
          codesign -dv "$app" 2>&1 | head -n 5 || true

      # The runner is logged in on a real 1024x768 desktop, so the app can be
      # launched and photographed even though nobody can watch it. Nobody can
      # click it either: every interaction from here is AppleScript.
      - name: Launch the app on the runner's desktop
        run: |
          mkdir -p gui
          open -a "$PWD/src-tauri/target/release/bundle/macos/Kept.app"
          for _ in $(seq 1 30); do
            pgrep -f "MacOS/kept" >/dev/null && break
            sleep 1
          done
          sleep 6
          if ! pgrep -fl "MacOS/kept"; then
            echo "Kept did not stay running"
            exit 1
          fi
          screencapture -x gui/01-launch.png
          osascript -e 'tell application "System Events" to get name of every process whose visible is true'

      # Alt+V is the Windows default summon key; on macOS it is Option+V, and
      # the shortcut plugin has to have registered it for this to show anything.
      - name: Try the summon hotkey
        run: |
          osascript -e 'tell application "System Events" to key code 9 using option down' || true
          sleep 3
          screencapture -x gui/02-hotkey.png

      # A Mac has no console for this process, so the log file is the only thing
      # that explains a crash or a refused permission.
      - name: Collect the app log
        if: always()
        run: |
          logdir="$HOME/Library/Logs/ikept.it"
          mkdir -p app-log
          cp -R "$logdir/." app-log/ 2>/dev/null || echo "no log directory at $logdir"
          ls -la app-log
          tail -n 80 app-log/*.log 2>/dev/null || true

      - name: Quit the app
        if: always()
        run: osascript -e 'tell application "System Events" to tell process "Kept" to keystroke "q" using command down' || pkill -f "MacOS/kept" || true

      - name: Upload the GUI screenshots and log
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: Kept-macos-gui
          path: |
            gui
            app-log
          if-no-files-found: warn

      - name: Upload the app bundle
        uses: actions/upload-artifact@v7
        with:
          name: Kept-macos-app
          path: src-tauri/target/release/bundle/macos/Kept.app
          if-no-files-found: error
